[package]
name = "ch32v003-rust-os-test"
version = "0.1.0"
edition = "2021"
[dependencies]
rv2k-api = { path = "../crates/rv2k-api" }
rv2k-kernel = { path = "../crates/rv2k-kernel" }
rv2k-arch = { path = "../crates/rv2k-arch" }
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = true

[features]
timer = []
coop = []
scheduler = []
syscall = []
syscall-bad-sp = ["syscall"]
syscall-kernel-fault = ["syscall"]
