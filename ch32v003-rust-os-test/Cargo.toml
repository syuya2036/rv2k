[package]
name = "ch32v003-rust-os-test"
version = "0.1.0"
edition = "2021"
[dependencies]
rv2k-api = { path = "../crates/rv2k-api" }
rv2k-kernel = { path = "../crates/rv2k-kernel" }
rv2k-arch = { path = "../crates/rv2k-arch" }
rv2k-drivers = { path = "../crates/rv2k-drivers" }
rv2k-net = { path = "../crates/rv2k-net", optional = true }
rv2k-apps = { path = "../crates/rv2k-apps", optional = true }
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = true

[features]
timer = []
coop = []
scheduler = []
syscall = []
syscall-bad-sp = ["syscall"]
syscall-kernel-fault = ["syscall"]
services = ["rv2k-arch/timer"]
diagnostics = ["services"]
drivers = ["diagnostics"]
net = ["diagnostics", "dep:rv2k-net"]
tcp = ["net", "rv2k-net/tcp"]
netinfo-probe = ["tcp", "preempt-timing"]
shell = ["tcp", "preempt", "dep:rv2k-apps"]
preempt = ["services", "rv2k-arch/preempt"]
preempt-timing = ["preempt", "rv2k-arch/preempt-timing"]
preempt-probe = ["preempt-timing", "diagnostics"]
fault-preempt-pc = ["preempt-probe"]
fault-preempt-lock = ["preempt-probe"]
compact-probe = ["diagnostics"]
emulator-stop = []
fault-canary = ["diagnostics"]
fault-irq-canary = ["diagnostics"]
fault-kernel-canary = ["diagnostics"]
fault-panic = ["diagnostics"]
fault-illegal = ["diagnostics"]
fault-kernel-illegal = ["diagnostics"]
fault-sp = ["diagnostics"]
fault-uart-stuck = ["fault-panic"]
