name: Kernel
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2021 --check host/net-harness/src/*.rs
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked
  rv32ec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ch32v003-rust-os-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install nightly-2026-03-12 --profile minimal --component rust-src --component llvm-tools-preview
      - run: bash scripts/setup-emulator.sh
      - run: bash scripts/network.sh
      - run: bash scripts/tcp.sh
      - run: bash scripts/preempt.sh
      - run: bash scripts/snapshot.sh
      - run: bash scripts/shell.sh
      - run: bash scripts/http.sh --virtual-only
      - run: bash scripts/drivers.sh
      - run: bash scripts/diagnostics.sh
      - run: python3 scripts/diagnostics-negative.py
      - run: python3 scripts/diagnostics-negative.py --tcp-build-profile
      - run: python3 scripts/diagnostics-negative.py --preempt-build-profile
      - run: python3 scripts/budget-negative.py
      - run: bash scripts/services.sh
      - run: bash scripts/syscall.sh
      - run: python3 scripts/syscall-negative.py
      - run: bash scripts/scheduler.sh
      - run: bash scripts/coop.sh
      - run: python3 scripts/coop-negative.py
      - run: bash scripts/build.sh
      - run: bash scripts/run.sh
      - run: bash scripts/timer.sh
